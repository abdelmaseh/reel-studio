name: Check publication content
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Audit authored release history, not GitHub's temporary PR merge author.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: node scripts/publication-check.mjs
      - run: node scripts/publication-check.mjs --history
  editor:
    name: Editor after a clean installation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Install independent engine packages, media tools and fonts
        run: node scripts/studio.mjs setup --foreground --steps folders,packages,ffmpeg,fonts
      - name: Typecheck the installed engine
        working-directory: engine
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Check the generated style guides
        run: node scripts/style-docs.mjs --check
      - name: Check the assistant guide copies
        run: node scripts/sync-assistant-guides.mjs --check
      - name: Check editor readiness and live editing
        run: node --test --test-concurrency=1 tests/engine-dependencies.test.mjs tests/creator-cta-keyword.test.mjs tests/assistant-permissions.test.mjs tests/clean-install.test.mjs tests/review-live-api.test.mjs tests/review-live-follow.test.mjs tests/review-live-save.test.mjs tests/editorial-scenes.test.mjs tests/motion-primitives.test.mjs tests/graphics-audio.test.mjs tests/editor-runtime-options.test.mjs tests/project-scenes.test.mjs tests/performance-controls.test.mjs tests/alignment-workflow.test.mjs tests/emphasis-proposals.test.mjs tests/publishing-flexibility.test.mjs tests/bootstrap-profile.test.mjs tests/project-scene-example.test.mjs tests/proxy-cache-hardlinks.test.mjs tests/review-export.test.mjs tests/style-baselines.test.mjs tests/style-registry.test.mjs tests/style-themes.test.mjs tests/style-sound-palettes.test.mjs tests/style-completeness.test.mjs tests/font-css.test.mjs tests/font-faces.test.mjs tests/grid-sans-font.test.mjs tests/style-docs.test.mjs tests/grid-glide-assets.test.mjs tests/grid-glide-demo.test.mjs tests/grid-glide-director.test.mjs tests/grid-glide-docs.test.mjs tests/grid-glide-editor.test.mjs tests/grid-glide-ending.test.mjs tests/grid-glide-kit.test.mjs tests/grid-glide-layout.test.mjs tests/grid-glide-math.test.mjs tests/grid-glide-render.test.mjs tests/grid-glide-rtl-lint.test.mjs tests/grid-glide-scene-render.test.mjs tests/grid-glide-scenes.test.mjs tests/grid-glide-sound.test.mjs tests/grid-glide-style.test.mjs tests/grid-glide-text.test.mjs tests/grid-glide-video-predicates.test.mjs tests/graphics-audio-ffmpeg.test.mjs tests/release-notes.test.mjs tests/transcription-setup.test.mjs tests/studio-download.test.mjs tests/one-shot-math.test.mjs tests/one-shot-render.test.mjs tests/one-shot-scene.test.mjs tests/one-shot-sound.test.mjs tests/cartoon-sound.test.mjs tests/cartoon-scene.test.mjs tests/cartoon-math.test.mjs tests/cartoon-render.test.mjs tests/cartoon-assets.test.mjs tests/cartoon-mouth.test.mjs tests/cartoon-lint.test.mjs tests/cartoon-docs.test.mjs tests/editor-scene-templates.test.mjs tests/editor-look.test.mjs tests/editor-keymap.test.mjs tests/review-sfx-preview.test.mjs tests/output-boundary.test.mjs tests/card-labels.test.mjs tests/digits.test.mjs tests/digits-preference.test.mjs tests/digits-render.test.mjs tests/digits-captions.test.mjs tests/settings-arabic.test.mjs tests/transcription-chunks.test.mjs tests/transcription-compare.test.mjs tests/transcription-ab.test.mjs tests/production-manager.test.mjs tests/library-selection.test.mjs
      - name: Check statistics isolation and retries
        run: node --test scripts/tests/studio-stats.test.mjs scripts/tests/studio-stats-review.test.mjs scripts/tests/studio-stats-setup.test.mjs
